[project]
name = "pgr-assets"
version = "3.1.5"
description = "Huaxu asset retriever for Punishing: Gray Raven"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "brotli>=1.2.0",
    "lameenc>=1.8.1",
    "msgpack>=1.2.1",
    "numpy>=2.5.2",
    "orjson>=3.10.0",
    "pillow>=12.3.0",
    "pycricodecs-archive>=0.4.11",
    "pycryptodome>=3.23.0",
    "pygltflib>=1.16.5",
    "python-ffmpeg>=2.0.12",
    "requests>=2.34.2",
    "tqdm>=4.67.3",
    "typed-argument-parser>=1.12.0",
    "unitypy>=1.25.3",
]

[project.scripts]
pgr-assets = "pgr_assets:main"

[dependency-groups]
dev = ["pyright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
